[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ms-segip"
version = "1.0.0"
description = "Microservicio de integración con servicios SOAP de SEGIP y extracción de certificaciones PDF"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Fiscalía General del Estado", email = "soporte@fiscalia.gob.bo" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.0",
    "defusedxml>=0.7.1",
    "pymupdf>=1.24.0",
    "python-multipart>=0.0.12",
    "sqlalchemy>=2.0.35",
    "asyncpg>=0.29.0",
    "boto3>=1.34.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "respx>=0.22.0",
    "ruff>=0.7.0",
    "aiosqlite>=0.20.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line too long (handled by formatter)
    "B008", # do not perform function calls in argument defaults (FastAPI Depends)
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: tests that interact with live SEGIP intranet service (deselect with '-m \"not integration\"')",
]
