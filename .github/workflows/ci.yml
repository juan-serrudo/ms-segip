name: CI Pipeline

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Análisis estático y formato (Ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Ejecutar pruebas unitarias
        run: |
          pytest -v --cov=app --cov-report=term-missing -m "not integration"

      - name: Validar construcción de Docker
        run: |
          docker build -t ms-segip:ci .
